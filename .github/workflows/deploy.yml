name: Публикация сайта Физмат

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
      - name: Подготовить статический сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Дождаться регистрации артефакта
        run: sleep 20
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
